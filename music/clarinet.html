<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本格バスクラリネット 運指＆発音シミュレーター</title>
    <style>
        :root {
            --wood-gradient: linear-gradient(90deg, #120c08 0%, #2c1e14 30%, #3d2a1c 50%, #2c1e14 70%, #120c08 100%);
            --metal-gradient: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 50%, #4b5563 100%);
            --bell-gradient: linear-gradient(90deg, #4b5563 0%, #d1d5db 40%, #ffffff 50%, #9ca3af 70%, #374151 100%);
            --active-glow: #00f0ff;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #18181c;
            color: #e2e8f0;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #22222a;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-top: 0; color: #fff; font-size: 1.4rem; letter-spacing: 1px; }
        
        /* ゲージセクション */
        .gauge-section {
            background: #15151c;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }
        .gauge-label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        .slider {
            width: 100%;
            -webkit-appearance: none;
            height: 10px;
            border-radius: 5px;
            background: #374151;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--active-glow);
            cursor: pointer;
            box-shadow: 0 0 10px var(--active-glow);
        }

        /* ディスプレイ */
        .status-display {
            background: #09090d;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 5px solid var(--active-glow);
            margin-bottom: 20px;
        }
        .note-name { font-size: 1.8rem; font-weight: bold; color: #fff; margin: 5px 0; text-shadow: 0 0 10px rgba(0,240,255,0.3); }
        .status-text { font-size: 0.85rem; color: #94a3b8; }

        /* 演奏メインボタン */
        .blow-btn {
            width: 100%;
            padding: 18px;
            margin-bottom: 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(29, 78, 216, 0.4);
            transition: all 0.1s;
        }
        .blow-btn.blowing {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
        }

        /* バスクラリネット全体のグラフィック構造 */
        .instrument-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        /* 金属製ネック（上部） */
        .neck {
            width: 30px;
            height: 40px;
            background: var(--metal-gradient);
            border-radius: 15px 15px 0 0;
            position: relative;
        }
        .neck::after {
            content: ''; position: absolute; top: -15px; left: 5px;
            width: 20px; height: 15px; background: #555; border-radius: 5px 5px 0 0;
        }

        /* 木製管体（本体） */
        .clarinet-body {
            position: relative;
            width: 100px;
            background: var(--wood-gradient);
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* 金属製のキイポスト・芯金を表現する縦のライン */
        .rod-line {
            position: absolute;
            left: 20px; top: 0; width: 4px; height: 100%;
            background: var(--metal-gradient);
            z-index: 1;
        }

        .section-label {
            font-size: 0.7rem; color: #94a3b8; text-transform: uppercase;
            letter-spacing: 1px; z-index: 2; background: rgba(0,0,0,0.4);
            padding: 2px 6px; border-radius: 4px; margin: 2px 0 -6px 0;
        }

        /* キーの共通スタイル */
        .key {
            width: 38px; height: 38px; border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, #cbd5e1, #94a3b8);
            border: 3px solid #475569;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6), inset 0 2px 3px #fff;
            cursor: pointer; position: relative; z-index: 2;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        /* トーンホール（穴）の表現 */
        .key.ring::after {
            content: ''; position: absolute; top: 25%; left: 25%;
            width: 50%; height: 50%; background: #1a110b; border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.9);
        }
        /* キーが押された状態（トグルロック） */
        .key.active {
            background: linear-gradient(135deg, #00f0ff, #0077b6);
            border-color: #00b4d8;
            box-shadow: 0 0 15px var(--active-glow), inset 0 1px 2px #fff;
            transform: translateY(2px);
        }
        .key.active.ring::after { background: #0077b6; }

        /* バスクラ特有のレジスターキーや低音レバーの形状変化 */
        .key.thumb { width: 44px; height: 24px; border-radius: 6px; }
        .key.lever { width: 20px; height: 36px; border-radius: 6px; }

        /* 金属製上向きベル（下部） */
        .bell {
            width: 100px;
            height: 70px;
            background: var(--bell-gradient);
            border-radius: 0 0 50px 50px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6);
            position: relative;
        }
        .bell-flare {
            position: absolute; bottom: -10px; left: -10px;
            width: 120px; height: 20px;
            background: var(--bell-gradient);
            border-radius: 50%;
        }

        .instructions {
            font-size: 0.8rem; color: #64748b; text-align: center; margin-top: 15px; line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>バスクラリネット・シミュレーター</h2>

    <div class="status-display">
        <div class="status-text">現在の音（実音B♭移調ベース）</div>
        <div class="note-name" id="note-display">消音中</div>
        <div class="status-text" id="status-desc">キーを選んで、下のボタンで息を吹き込んでください</div>
    </div>

    <div class="gauge-section">
        <div class="gauge-label">
            <span>💨 息の強さ (Breath Pressure)</span>
            <span id="breath-val">55%</span>
        </div>
        <input type="range" id="breath-slider" class="slider" min="0" max="100" value="55">
    </div>

    <button class="blow-btn" id="blow-button">💨 息を吹き込む (音を鳴らす)</button>

    <div class="instrument-wrapper">
        <div class="neck"></div>

        <div class="clarinet-body">
            <div class="rod-line"></div>
            
            <span class="section-label">Thumb / 裏面</span>
            <div class="key thumb" id="key-reg" title="レジスターキー (Register)"></div>
            <div class="key thumb ring" id="key-lThumb" title="左手親指キー (Thumb)"></div>

            <span class="section-label">Left Hand / 左手</span>
            <div class="key ring" id="key-l1" title="左手 第1指 (L1)"></div>
            <div class="key ring" id="key-l2" title="左手 第2指 (L2)"></div>
            <div class="key ring" id="key-l3" title="左手 第3指 (L3)"></div>

            <span class="section-label">Right Hand / 右手</span>
            <div class="key ring" id="key-r1" title="右手 第1指 (R1)"></div>
            <div class="key ring" id="key-r2" title="右手 第2指 (R2)"></div>
            <div class="key ring" id="key-r3" title="右手 第3指 (R3)"></div>

            <span class="section-label">Low Notes / 低音拡張レバー</span>
            <div class="key lever" id="key-low" title="Low C 拡張レバー"></div>
        </div>

        <div class="bell">
            <div class="bell-flare"></div>
        </div>
    </div>

    <div class="instructions">
        【使い方】<br>
        1. 楽器のキーをタップして、押さえる組み合わせ（運指）を作ります（トグル式）。<br>
        2. 「息を吹き込む」を押すと音が鳴り、もう一度押すと止まります。<br>
        3. 音を鳴らしながら、息の強さゲージを動かして変化を楽しめます。
    </div>
</div>

<script>
    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let isBlowing = false; // 息を吹き込んでいるかどうかのフラグ

    // 各キーの「押されているか（true/false）」の状態を管理
    const keyStates = {
        'key-reg': false, 'key-lThumb': false,
        'key-l1': false, 'key-l2': false, 'key-l3': false,
        'key-r1': false, 'key-r2': false, 'key-r3': false, 'key-low': false
    };

    // 本物のバスクラリネットの組み合わせ（運指）ロジック
    function determineNote() {
        const breath = parseInt(document.getElementById('breath-slider').value);

        // 息が弱すぎる場合（音が鳴らない）
        if (breath < 15) {
            return { freq: 0, name: "スカスカ...", desc: "息の圧力が足りず、音になりません。" };
        }

        // 息が強すぎる場合（ひっくり返る・100%でも鳴るように修正！）
        if (breath >= 85) {
            // どんな運指でも倍音がひっくり返った高音（スクィーク）を発生
            return { freq: 1100 + (breath * 2), name: "ピーッ！！ (Squeak)", desc: "息が強すぎて音がひっくり返りました！管楽器のミス音です。" };
        }

        // --- 以下、本物の運指の組み合わせ判定 ---
        
        // 1. 最低音 Low C (すべて全閉 + Lowレバー)
        if (keyStates['key-lThumb'] && keyStates['key-l1'] && keyStates['key-l2'] && keyStates['key-l3'] && 
            keyStates['key-r1'] && keyStates['key-r2'] && keyStates['key-r3'] && keyStates['key-low']) {
            return { freq: 65.41, name: "最低音 Low C (実音 B♭0)", desc: "ロング管バスクラならではの、床を揺らす重低音です！" };
        }

        // 2. 低音 F (シャリュモー音域、レジスターなし全閉)
        if (keyStates['key-lThumb'] && keyStates['key-l1'] && keyStates['key-l2'] && keyStates['key-l3'] && 
            keyStates['key-r1'] && keyStates['key-r2'] && keyStates['key-r3'] && !keyStates['key-reg']) {
            return { freq: 87.31, name: "低音 F (実音 E♭1)", desc: "豊かに響く、バスクラリネットの魅力が詰まった音域です。" };
        }

        // 3. 中音 C (左手のみ全閉)
        if (keyStates['key-lThumb'] && keyStates['key-l1'] && keyStates['key-l2'] && keyStates['key-l3'] && 
            !keyStates['key-r1'] && !keyStates['key-r2'] && !keyStates['key-r3'] && !keyStates['key-reg']) {
            return { freq: 130.81, name: "中音 C (実音 B♭1)", desc: "落ち着いた中音域（シャリュモー）の響きです。" };
        }

        // 4. 高音 G (レジスターキー + 左手全閉：クラリオン音域)
        if (keyStates['key-reg'] && keyStates['key-lThumb'] && keyStates['key-l1'] && keyStates['key-l2'] && keyStates['key-l3'] &&
            !keyStates['key-r1'] && !keyStates['key-r2'] && !keyStates['key-r3']) {
            if (breath < 40) {
                return { freq: 130.81, name: "裏返りミス", desc: "レジスターキーを押していますが、息が弱いため下のCの音に落ちました。" };
            }
            return { freq: 392.00, name: "高音 G (実音 F3)", desc: "クラリオン音域。クリアで伸びやかな高音です。" };
        }

        // 5. 開放音 G (何も押さない)
        let anyPressed = Object.values(keyStates).some(state => state === true);
        if (!anyPressed) {
            return { freq: 233.08, name: "開放 G (実音 F2)", desc: "すべての穴が開いた状態の、少しカサカサした軽い音です。" };
        }

        // 6. その他の未登録の組み合わせ（ファジー対応）
        let pressedCount = Object.values(keyStates).filter(v => v).length;
        // 押している数が多いほど管が長くなるので低音にする
        let estimatedFreq = 233.08 - (pressedCount * 18);
        if (keyStates['key-reg']) estimatedFreq *= 2.5; // レジスターがあれば高音化
        
        return { freq: estimatedFreq, name: "複合音", desc: "キーの組み合わせに応じたシミュレーション音です。" };
    }

    // オーディオ初期化
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            oscillator.type = 'triangle'; // クラリネットに近い丸みのある波形
            oscillator.frequency.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }
    }

    // 音のリアルタイム更新
    function updateSound() {
        if (!isBlowing || !audioCtx) return;

        const noteData = determineNote();
        const breath = parseInt(document.getElementById('breath-slider').value);

        if (noteData.freq === 0) {
            gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.03);
        } else {
            // スクィーク（ミス音）の時は波形をきつくする
            oscillator.type = (noteData.name.includes("ピー")) ? 'sawtooth' : 'triangle';
            
            // 息の強さでピッチがわずかに揺れるリアルな挙動
            const pitchBend = (breath - 55) * 0.15;
            oscillator.frequency.setTargetAtTime(noteData.freq + pitchBend, audioCtx.currentTime, 0.04);
            
            // 音量も息の強さに比例
            const targetVolume = (breath / 100) * 0.6;
            gainNode.gain.setTargetAtTime(targetVolume, audioCtx.currentTime, 0.04);
        }

        noteDisplay.innerText = noteData.name;
        statusDesc.innerText = noteData.desc;
    }

    // キーのクリックイベント（トグル方式：押すごとにON/OFFが切り替わる）
    document.querySelectorAll('.key').forEach(el => {
        const keyId = el.id;
        
        const handleKeyClick = (e) => {
            e.preventDefault();
            // 状態を反転
            keyStates[keyId] = !keyStates[keyId];
            el.classList.toggle('active', keyStates[keyId]);
            
            // 音が鳴っている最中なら、リアルタイムに音を変える
            if (isBlowing) {
                updateSound();
            }
        };

        el.addEventListener('mousedown', handleKeyClick);
        el.addEventListener('touchstart', handleKeyClick);
    });

    // 演奏ボタンのON/OFF切り替え
    const blowButton = document.getElementById('blow-button');
    const toggleBlow = () => {
        initAudio();
        if (!isBlowing) {
            // 演奏開始
            isBlowing = true;
            blowButton.innerText = "🛑 息を止める (消音)";
            blowButton.classList.add('blowing');
            updateSound();
        } else {
            // 演奏停止
            isBlowing = false;
            blowButton.innerText = "💨 息を吹き込む (音を鳴らす)";
            blowButton.classList.remove('blowing');
            gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
            document.getElementById('note-display').innerText = "消音中";
            document.getElementById('status-desc').innerText = "キーを選んで、上のボタンで息を吹き込んでください";
        }
    };

    blowButton.addEventListener('click', toggleBlow);

    // スライダーを動かしたときもリアルタイムに音に反映
    document.getElementById('breath-slider').addEventListener('input', (e) => {
        document.getElementById('breath-val').innerText = `${e.target.value}%`;
        if (isBlowing) {
            updateSound();
        }
    });
</script>
</body>
</html>
