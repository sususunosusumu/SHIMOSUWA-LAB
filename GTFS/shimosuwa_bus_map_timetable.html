<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>下諏訪 あざみ号・スワンバス 地図時刻表ビューア</title>
  <meta name="description" content="下諏訪町のあざみ号・スワンバスのGTFSを読み込み、地図上の停留所クリックから発車時刻と便の全停留所を確認できるビューアです。" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ2ATmDN6+9fCpbO8f+gH9DXyD7u4B8=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--azami:#2563eb;--swan:#059669;--accent:#111827}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    header{padding:18px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{font-size:20px;margin:0;letter-spacing:.02em}.sub{color:var(--muted);font-size:13px;margin-top:4px}.wrap{display:grid;grid-template-columns:minmax(420px,1fr) 430px;min-height:calc(100vh - 78px)}
    #map{height:calc(100vh - 78px);width:100%}.panel{padding:16px;overflow:auto;border-left:1px solid var(--line);background:linear-gradient(180deg,#fff,#f8fafc)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 10px 30px rgba(15,23,42,.05)}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.azami.active{background:var(--azami);border-color:var(--azami)}.btn.swan.active{background:var(--swan);border-color:var(--swan)}
    .small{font-size:12px;color:var(--muted);line-height:1.55}.title{font-weight:800;font-size:17px;margin-bottom:4px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;color:#fff;margin-left:6px}.pill.azami{background:var(--azami)}.pill.swan{background:var(--swan)}
    .time-list{display:grid;gap:8px}.time-row{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;cursor:pointer}.time-row:hover{border-color:#94a3b8;background:#f8fafc}.time{font-size:17px;font-weight:900}.route{font-size:12px;color:var(--muted);margin-top:2px}
    table{width:100%;border-collapse:separate;border-spacing:0 6px}td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;font-size:13px}td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px;font-weight:800;white-space:nowrap}td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}.loading{padding:18px;color:var(--muted)}
    .search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:15px}.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.az{background:var(--azami)}.sw{background:var(--swan)}
    @media(max-width:880px){.wrap{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid var(--line)}#map{height:55vh}}
  </style>
</head>
<body>
<header>
  <div><h1>下諏訪 あざみ号・スワンバス 地図時刻表ビューア</h1><div class="sub">地図の停留所をクリック → 発車時刻 → 便の全行程を確認</div></div>
  <div class="legend"><span><i class="dot az"></i>あざみ号</span><span><i class="dot sw"></i>スワンバス</span></div>
</header>
<div class="wrap">
  <div id="map"></div>
  <aside class="panel">
    <div class="card">
      <div class="tabs">
        <button class="btn active" data-filter="all">両方</button>
        <button class="btn azami" data-filter="あざみ号">あざみ号</button>
        <button class="btn swan" data-filter="スワンバス">スワンバス</button>
      </div>
      <p class="small">同じ名前の停留所が複数ある場合、GTFS上の停留所IDごとに表示します。スワンバスの下諏訪町外停留所は、位置情報が未補正の場合があります。</p>
      <input id="search" class="search" placeholder="停留所名を検索 例：下諏訪駅" />
    </div>
    <div id="info" class="card"><div class="loading">GTFSを読み込み中です…</div></div>
    <div id="departures" class="card" style="display:none"></div>
    <div id="trip" class="card" style="display:none"></div>
  </aside>
</div>
<script>
const GTFS_URL = './shimosuwa_azami_swan_merged_gtfs.zip';
const state = { filter:'all', stops:[], routes:[], trips:[], stopTimes:[], markers:[], selectedStop:null };
const map = L.map('map').setView([36.071,138.092], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const layer = L.layerGroup().addTo(map);

function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c==='"' && q && n==='"'){cur+='"'; i++; continue}
    if(c==='"'){q=!q; continue}
    if(c===',' && !q){row.push(cur); cur=''; continue}
    if((c==='\n'||c==='\r') && !q){ if(c==='\r'&&n==='\n') i++; row.push(cur); if(row.some(v=>v!=='')) rows.push(row); row=[]; cur=''; continue}
    cur+=c;
  }
  if(cur || row.length){row.push(cur); rows.push(row)}
  const head=rows.shift().map(x=>x.trim());
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}
async function loadGTFS(){
  const res = await fetch(GTFS_URL);
  if(!res.ok) throw new Error('GTFS ZIPを読み込めません: '+GTFS_URL);
  const zip = await JSZip.loadAsync(await res.arrayBuffer());
  const files = {};
  for(const name of ['stops.txt','routes.txt','trips.txt','stop_times.txt']) files[name]=parseCSV(await zip.file(name).async('text'));
  state.stops=files['stops.txt'].map(s=>({...s,bus_system:s.stop_id.startsWith('AZAMI_')?'あざみ号':s.stop_id.startsWith('SWAN_')?'スワンバス':''}));
  state.routes=files['routes.txt']; state.trips=files['trips.txt']; state.stopTimes=files['stop_times.txt'];
  renderMarkers(); renderInfo();
}
function color(system){return system==='あざみ号'?'#2563eb':'#059669'}
function visibleStops(){
  const q=document.getElementById('search').value.trim();
  return state.stops.filter(s=>(state.filter==='all'||s.bus_system===state.filter)&&(!q||s.stop_name.includes(q))&&s.stop_lat&&s.stop_lon);
}
function renderMarkers(){
  layer.clearLayers(); state.markers=[];
  const bounds=[];
  for(const s of visibleStops()){
    const lat=Number(s.stop_lat), lon=Number(s.stop_lon); if(!isFinite(lat)||!isFinite(lon)) continue;
    const marker=L.circleMarker([lat,lon],{radius:7,color:color(s.bus_system),fillColor:color(s.bus_system),fillOpacity:.85,weight:2})
      .bindTooltip(`${s.stop_name}（${s.bus_system}）`)
      .on('click',()=>selectStop(s));
    marker.addTo(layer); state.markers.push(marker); bounds.push([lat,lon]);
  }
  if(bounds.length) map.fitBounds(bounds,{padding:[25,25],maxZoom:15});
}
function routeById(id){return state.routes.find(r=>r.route_id===id)||{}}
function tripById(id){return state.trips.find(t=>t.trip_id===id)||{}}
function stopById(id){return state.stops.find(s=>s.stop_id===id)||{stop_name:id}}
function fmt(t){return (t||'').replace(/^0/,'').replace(/:00$/,'')}
function renderInfo(){
  const info=document.getElementById('info');
  const count=visibleStops().length;
  info.innerHTML=`<div class="title">表示中の停留所：${count}件</div><div class="small">あざみ号・スワンバスを切り替えて、地図上の停留所を選択してください。</div>`;
}
function selectStop(stop){
  state.selectedStop=stop; document.getElementById('trip').style.display='none';
  const dep = state.stopTimes.filter(st=>st.stop_id===stop.stop_id).map(st=>({st, trip:tripById(st.trip_id)})).sort((a,b)=>(a.st.departure_time||'').localeCompare(b.st.departure_time||''));
  const box=document.getElementById('departures'); box.style.display='block';
  const pillClass=stop.bus_system==='あざみ号'?'azami':'swan';
  box.innerHTML=`<div class="title">${stop.stop_name}<span class="pill ${pillClass}">${stop.bus_system}</span></div><div class="small">発車時刻：${dep.length}件。時刻をクリックすると、その便の全行程を表示します。</div><div class="time-list">${dep.map(d=>{const r=routeById(d.trip.route_id);return `<button class="time-row" data-trip="${d.st.trip_id}"><div class="time">${fmt(d.st.departure_time||d.st.arrival_time)}</div><div class="route">${r.route_short_name||r.route_long_name||''}　${d.trip.trip_headsign||''}</div></button>`}).join('')}</div>`;
  box.querySelectorAll('.time-row').forEach(b=>b.addEventListener('click',()=>showTrip(b.dataset.trip, stop.stop_id)));
}
function showTrip(tripId, selectedStopId){
  const trip=tripById(tripId), route=routeById(trip.route_id);
  const rows=state.stopTimes.filter(st=>st.trip_id===tripId).sort((a,b)=>Number(a.stop_sequence)-Number(b.stop_sequence));
  const box=document.getElementById('trip'); box.style.display='block';
  box.innerHTML=`<div class="title">${trip.trip_headsign||'便の行程'}</div><div class="small">${route.route_short_name||route.route_long_name||''}</div><table>${rows.map(st=>{const s=stopById(st.stop_id); const mark=st.stop_id===selectedStopId?' style="outline:2px solid #111827"':''; return `<tr${mark}><td>${fmt(st.departure_time||st.arrival_time)}</td><td>${s.stop_name}</td></tr>`}).join('')}</table>`;
}
document.querySelectorAll('.btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.filter=btn.dataset.filter;document.getElementById('departures').style.display='none';document.getElementById('trip').style.display='none';renderMarkers();renderInfo();}));
document.getElementById('search').addEventListener('input',()=>{renderMarkers();renderInfo();});
loadGTFS().catch(e=>{document.getElementById('info').innerHTML=`<div class="title">読み込みエラー</div><div class="small">${e.message}<br>このHTMLと shimosuwa_azami_swan_merged_gtfs.zip を同じフォルダに置いてください。</div>`});
</script>
</body>
</html>
