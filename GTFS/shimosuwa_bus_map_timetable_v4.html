<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>下諏訪 あざみ号・スワンバス 地図時刻表ビューア</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f8fafc}.top{height:112px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:22px 30px}.top h1{font-size:24px;margin:0 0 8px;font-weight:800}.top p{margin:0;color:#64748b}.legend{font-size:16px;white-space:nowrap}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 6px}.blue{background:#2563eb}.green{background:#059669}.layout{display:grid;grid-template-columns:minmax(0,1fr) 500px;height:calc(100vh - 112px)}#map{width:100%;height:100%;min-height:500px}.side{border-left:1px solid #e5e7eb;background:#f8fafc;padding:20px;overflow:auto}.card{background:white;border:1px solid #e5e7eb;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 12px 30px rgba(15,23,42,.06)}.buttons{display:flex;gap:10px;margin-bottom:14px}.btn{border:1px solid #e5e7eb;background:white;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}.btn.active.azami{background:#2563eb;color:white;border-color:#2563eb}.btn.active.swan{background:#059669;color:white;border-color:#059669}.btn.active.both{background:#111827;color:white;border-color:#111827}.note{color:#64748b;font-size:14px;line-height:1.7}.search{width:100%;border:1px solid #e5e7eb;border-radius:14px;padding:13px 15px;font-size:16px;margin-top:12px}.title{font-size:20px;font-weight:800;margin:0 0 10px}.small{font-size:14px;color:#64748b;line-height:1.7}.departures button,.trip button{width:100%;text-align:left;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:12px;margin:6px 0;cursor:pointer}.departures button:hover,.trip button:hover{background:#f1f5f9}.time{font-weight:800;font-size:17px;margin-right:8px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;background:#eef2ff;color:#3730a3}.stopline{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #f1f5f9}.leaflet-container{font:inherit}.leaflet-marker-icon,.leaflet-marker-shadow{display:block}.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.6}@media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}#map{height:58vh}.side{border-left:0}.top{height:auto;align-items:flex-start;gap:12px;padding:16px;flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div><h1>下諏訪 あざみ号・スワンバス 地図時刻表ビューア</h1><p>地図の停留所をクリック → 発車時刻 → 便の全行程を確認</p></div><div class="legend"><span class="dot blue"></span>あざみ号　<span class="dot green"></span>スワンバス</div></header>
<main class="layout"><div id="map"></div><aside class="side"><section class="card"><div class="buttons"><button class="btn active both" data-filter="both">両方</button><button class="btn azami" data-filter="azami">あざみ号</button><button class="btn swan" data-filter="swan">スワンバス</button></div><p class="note">GISの実座標をそのまま使用します。位置情報が未補正の停留所は地図上に表示しません。</p><input id="search" class="search" placeholder="停留所名を検索 例：下諏訪駅" /></section><section class="card"><h2 class="title" id="selectedTitle">表示中の停留所：0件</h2><p class="small" id="summary">データ読込中です。</p><div id="departures" class="departures"></div></section><section class="card" id="tripCard" style="display:none"><h2 class="title">便の全行程</h2><p class="small" id="tripTitle"></p><div id="tripStops" class="trip"></div></section></aside></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const GTFS_ZIP = 'shimosuwa_azami_swan_merged_gtfs_v4.zip';
let map, data={}, markers=[], currentFilter='both', selectedStop=null;
const color = system => system==='azami' ? '#2563eb' : '#059669';
function csvParse(text){const rows=[];let row=[], cur='', q=false;for(let i=0;i<text.length;i++){const c=text[i], n=text[i+1];if(c==='"'){if(q&&n==='"'){cur+='"';i++;}else q=!q;}else if(c===','&&!q){row.push(cur);cur='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cur); if(row.some(x=>x!=='')) rows.push(row); row=[]; cur='';}else cur+=c;} if(cur!==''||row.length){row.push(cur);rows.push(row);} const head=rows.shift().map(h=>h.replace(/^\uFEFF/,'')); return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])));}
async function load(){map=L.map('map',{zoomControl:true}).setView([36.071,138.092],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map); const buf=await fetch(GTFS_ZIP,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('GTFS ZIPが読み込めません: '+GTFS_ZIP);return r.arrayBuffer()}); const zip=await JSZip.loadAsync(buf); async function read(name){return csvParse(await zip.file(name).async('string'));}
 data.stops=await read('stops.txt'); data.routes=await read('routes.txt'); data.trips=await read('trips.txt'); data.stop_times=await read('stop_times.txt');
 data.routeById=Object.fromEntries(data.routes.map(r=>[r.route_id,r])); data.tripById=Object.fromEntries(data.trips.map(t=>[t.trip_id,t])); data.stopById=Object.fromEntries(data.stops.map(s=>[s.stop_id,s])); data.timesByStop={}; data.timesByTrip={}; for(const st of data.stop_times){(data.timesByStop[st.stop_id]??=[]).push(st);(data.timesByTrip[st.trip_id]??=[]).push(st);} Object.values(data.timesByStop).forEach(a=>a.sort((x,y)=>(x.departure_time||x.arrival_time).localeCompare(y.departure_time||y.arrival_time))); Object.values(data.timesByTrip).forEach(a=>a.sort((x,y)=>(+x.stop_sequence)-(+y.stop_sequence)));
 renderMarkers();}
function stopSystem(s){return s.stop_id.startsWith('AZAMI_')?'azami':'swan'}
function validStop(s){return String(s.location_source||'').startsWith('real_json') && s.stop_lat && s.stop_lon && !isNaN(+s.stop_lat) && !isNaN(+s.stop_lon)}
function renderMarkers(){markers.forEach(m=>map.removeLayer(m)); markers=[]; const q=document.getElementById('search').value.trim(); const shown=data.stops.filter(s=>validStop(s)).filter(s=>currentFilter==='both'||stopSystem(s)===currentFilter).filter(s=>!q||s.stop_name.includes(q)); for(const s of shown){const sys=stopSystem(s); const icon=L.divIcon({className:'',html:`<div style="width:18px;height:18px;border-radius:50%;background:${color(sys)};border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.25)"></div>`,iconSize:[18,18],iconAnchor:[9,9]}); const m=L.marker([+s.stop_lat,+s.stop_lon],{icon}).addTo(map).bindTooltip(`${s.stop_name}（${sys==='azami'?'あざみ号':'スワンバス'}）`); m.on('click',()=>selectStop(s)); markers.push(m);} document.getElementById('selectedTitle').textContent=`表示中の停留所：${shown.length}件`; document.getElementById('summary').textContent='地図上の停留所を選択してください。'; if(shown.length){const g=L.featureGroup(markers); map.fitBounds(g.getBounds().pad(0.15));}}
function selectStop(s){selectedStop=s; const sys=stopSystem(s); document.getElementById('selectedTitle').textContent=`${s.stop_name}（${sys==='azami'?'あざみ号':'スワンバス'}）`; const list=(data.timesByStop[s.stop_id]||[]).filter(x=>x.departure_time||x.arrival_time); document.getElementById('summary').textContent=`発車時刻：${list.length}件`; const box=document.getElementById('departures'); box.innerHTML=''; document.getElementById('tripCard').style.display='none'; if(!list.length){box.innerHTML='<p class="small">この停留所の発車時刻が見つかりません。</p>';return;} for(const t of list){const trip=data.tripById[t.trip_id]||{}; const route=data.routeById[trip.route_id]||{}; const b=document.createElement('button'); b.innerHTML=`<span class="time">${t.departure_time||t.arrival_time}</span><span class="pill">${route.route_short_name||route.route_long_name||''}</span><br><span class="small">${trip.trip_headsign||trip.trip_id}</span>`; b.onclick=()=>showTrip(t.trip_id); box.appendChild(b);}}
function showTrip(trip_id){const arr=data.timesByTrip[trip_id]||[]; const trip=data.tripById[trip_id]||{}; const route=data.routeById[trip.route_id]||{}; document.getElementById('tripCard').style.display='block'; document.getElementById('tripTitle').textContent=`${route.route_long_name||route.route_short_name||''} ${trip.trip_headsign||''}`; const box=document.getElementById('tripStops'); box.innerHTML=''; const latlng=[]; for(const st of arr){const stop=data.stopById[st.stop_id]||{}; const div=document.createElement('div'); div.className='stopline'; div.innerHTML=`<div><b>${st.departure_time||st.arrival_time||''}</b></div><div>${stop.stop_name||st.stop_id}</div>`; box.appendChild(div); if(validStop(stop)) latlng.push([+stop.stop_lat,+stop.stop_lon]);} if(window.tripLine) map.removeLayer(window.tripLine); if(latlng.length>=2){window.tripLine=L.polyline(latlng,{color:'#111827',weight:4,opacity:.65}).addTo(map); map.fitBounds(window.tripLine.getBounds().pad(0.2));}}
document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active','both','azami','swan')); currentFilter=b.dataset.filter; b.classList.add('active',currentFilter); renderMarkers();}); document.getElementById('search').addEventListener('input',renderMarkers); load().catch(e=>{document.getElementById('summary').innerHTML='<span style="color:#dc2626">'+e.message+'</span>'; console.error(e);});
</script>
</body></html>
