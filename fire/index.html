<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>第30回操法大会 ホース展張練習プログラム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background-color: #4a5d4e; /* 操法場の地面 */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: pointer;
        }
        #ui-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ffcc00;
        }
        #result-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 320px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffcc00;
            border-radius: 10px;
            color: white;
            text-align: center;
            padding: 20px;
            display: none;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }
        #result-screen h2 {
            margin-top: 0;
            color: #ffcc00;
            font-size: 24px;
        }
        .score-val {
            font-size: 48px;
            font-weight: bold;
            color: #ff3333;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255,51,51,0.5);
        }
        #retry-btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            margin-top: 15px;
        }
        #instruction {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            text-align: center;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div id="score-box" class="hud-box">得点: --</div>
        <div id="status-box" class="hud-box">構え（右足固定）</div>
    </div>

    <div id="instruction">火点マークを狙って上へ素早くドラッグ！</div>

    <div id="result-screen">
        <h2 id="result-title">審査結果</h2>
        <div id="result-deviation">最大ズレ: -- cm</div>
        <div id="result-score" class="score-val">100点</div>
        <div id="result-comment">コメント</div>
        <button id="retry-btn" onclick="resetGame()">再チャレンジ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const viewWidth = Math.min(window.innerWidth, 450);
    const viewHeight = window.innerHeight;
    canvas.width = viewWidth;
    canvas.height = viewHeight;

    const startY = viewHeight * 0.85; 
    const targetY = viewHeight * 0.15; // 10m地点であり、火点マークの中心
    const playLengthPx = startY - targetY; 
    const pxToCm = 1000 / playLengthPx; 

    let gameState = 'ready'; 
    let startX = 0;
    let startY_touch = 0;
    let startTime = 0;
    let hosePoints = []; 
    
    let rollProgress = 0; 
    let rollSpeed = 0;
    let rollCurve = 0; 

    function resetGame() {
        gameState = 'ready';
        rollProgress = 0;
        rollSpeed = 0;
        rollCurve = 0;
        hosePoints = [];
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('score-box').innerText = '得点: --';
        document.getElementById('status-box').innerText = '構え（右足固定）';
        document.getElementById('instruction').style.display = 'block';
        draw();
    }

    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        } else if (e.changedTouches && e.changedTouches.length > 0) {
            return { x: e.changedTouches[0].clientX - rect.left, y: e.changedTouches[0].clientY - rect.top };
        } else {
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
    }

    function handleStart(x, y) {
        if (gameState !== 'ready') return;
        startX = x;
        startY_touch = y;
        startTime = performance.now();
        gameState = 'flicking';
    }

    function handleEnd(endX, endY) {
        if (gameState !== 'flicking') return;
        const duration = performance.now() - startTime;

        const deltaX = endX - startX;
        const deltaY = endY - startY_touch;

        if (deltaY < -30) {
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('status-box').innerText = '展張中！';
            
            const speedInput = Math.min(Math.abs(deltaY) / Math.max(duration, 1) * 15, 25);
            rollSpeed = Math.max(speedInput, 8) * 0.002; 

            rollCurve = (deltaX / Math.abs(deltaY)) * 45; 

            generateHosePath();
            gameState = 'rolling';
            animateRoll();
        } else {
            gameState = 'ready'; 
        }
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const coords = getCanvasCoords(e);
        handleStart(coords.x, coords.y);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        const coords = getCanvasCoords(e);
        handleEnd(coords.x, coords.y);
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
        const coords = getCanvasCoords(e);
        handleStart(coords.x, coords.y);
    });

    window.addEventListener('mouseup', (e) => {
        if (gameState !== 'flicking') return;
        const coords = getCanvasCoords(e);
        handleEnd(coords.x, coords.y);
    });

    function generateHosePath() {
        hosePoints = [];
        const segments = 100;
        let currentX = canvas.width / 2;

        for (let i = 0; i <= segments; i++) {
            const ratio = i / segments;
            const y = startY - (playLengthPx * ratio);
            
            if (i > 0) {
                const noise = Math.sin(ratio * Math.PI * 2.5) * (rollCurve * 0.4);
                const drift = ratio * ratio * rollCurve * 1.2;
                currentX = (canvas.width / 2) + drift + noise;
            }
            hosePoints.push({ x: currentX, y: y });
        }
    }

    function animateRoll() {
        if (gameState !== 'rolling') return;

        rollProgress += rollSpeed;
        rollSpeed *= 0.98; 

        if (rollProgress >= 1.0 || rollSpeed < 0.0005) {
            if (rollProgress > 1.0) rollProgress = 1.0;
            endGame();
            return;
        }

        draw();
        requestAnimationFrame(animateRoll);
    }

    function endGame() {
        gameState = 'result';
        let maxDevPx = 0;
        const activeCount = Math.floor(rollProgress * (hosePoints.length - 1));
        
        for (let i = 0; i <= activeCount; i++) {
            const dev = Math.abs(hosePoints[i].x - canvas.width / 2);
            if (dev > maxDevPx) maxDevPx = dev;
        }

        const maxDevCm = Math.round(maxDevPx * pxToCm * 10) / 10;
        let score = 100 - Math.floor(maxDevCm);
        if (score < 0) score = 0;

        document.getElementById('score-box').innerText = `得点: ${score}点`;
        document.getElementById('status-box').innerText = `展張完了`;
        document.getElementById('result-deviation').innerText = `最大ズレ: ${maxDevCm} cm`;
        document.getElementById('result-score').innerText = `${score}点`;

        let comment = "素晴らしい直進性です！見事な操法技術！";
        if (score < 95) comment = "わずかに右足の固定か、押し出しがブレています。体幹を意識しましょう。";
        if (score < 85) comment = "ホースが蛇行しています。目線を火点へ真っ直ぐ向け、腰を落として押し出してください。";
        if (score < 70) comment = "著しい曲がりです。左手のガイドレールが機能していません。再チャレンジで練習！";
        
        document.getElementById('result-comment').innerText = comment;
        document.getElementById('result-screen').style.display = 'block';

        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 理想ライン（白点線）
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, startY);
        ctx.lineTo(canvas.width / 2, targetY);
        ctx.stroke();
        ctx.setLineDash([]);

        // メートルの目盛
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'right';
        for (let m = 0; m <= 10; m += 2) {
            const y = startY - (playLengthPx * (m / 10));
            ctx.fillText(`${m}m`, canvas.width - 15, y + 4);
            ctx.fillRect(canvas.width - 10, y, 10, 1);
        }

        // --- 火点（標的）マークの描画 ---
        const targetRadius = 22;
        // 白い外枠
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.arc(canvas.width / 2, targetY, targetRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // 赤い「火」の文字
        ctx.fillStyle = '#ff3333';
        ctx.font = 'bold 20px "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('火', canvas.width / 2, targetY);

        // スタートライン
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, startY, canvas.width, 3);

        // ホース描画
        if (hosePoints.length > 0) {
            const currentIndex = Math.floor(rollProgress * (hosePoints.length - 1));
            
            // 下のライン
            ctx.strokeStyle = '#eaeaea';
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, startY);
            for (let i = 0; i <= currentIndex; i++) {
                ctx.lineTo(hosePoints[i].x, hosePoints[i].y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#d0d0d0';
            ctx.lineWidth = 10;
            ctx.stroke();

            // 上のライン
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, startY);
            for (let i = 0; i <= currentIndex; i++) {
                ctx.lineTo(hosePoints[i].x, hosePoints[i].y);
            }
            ctx.stroke();

            // メス金具
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, startY, 9, 0, Math.PI * 2);
            ctx.fill();

            // 転がる巻本体
            if (rollProgress < 1.0) {
                const head = hosePoints[currentIndex];
                const rollRadius = 18 - (10 * rollProgress);

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.arc(head.x + 4, head.y + 4, rollRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#e0e0e0';
                ctx.beginPath();
                ctx.arc(head.x, head.y, rollRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#999';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(head.x, head.y, rollRadius * 0.7, 0, Math.PI * 2);
                ctx.arc(head.x, head.y, rollRadius * 0.4, 0, Math.PI * 2);
                ctx.stroke();
            }

            // オス金具
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, startY - 5, 7, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 初期状態の巻ホース束
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.arc(canvas.width / 2 + 3, startY - 15, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, startY - 15, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#bbb';
            ctx.lineWidth = 2;
            for(let r = 5; r < 20; r += 4) {
                ctx.beginPath();
                ctx.arc(canvas.width / 2, startY - 15, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = '#d4af37';
            ctx.fillRect(canvas.width / 2 - 12, startY - 4, 24, 8);
        }
    }

    resetGame();
    window.addEventListener('resize', () => {
        canvas.width = Math.min(window.innerWidth, 450);
        canvas.height = window.innerHeight;
        resetGame();
    });
</script>
</body>
</html>
