<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>第30回操法大会 ホース展張練習プログラム V2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background-color: #4a5d4e; /* 操法場の地面 */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: pointer;
        }
        #ui-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ffcc00;
        }
        #result-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 320px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffcc00;
            border-radius: 10px;
            color: white;
            text-align: center;
            padding: 20px;
            display: none;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }
        #result-screen h2 {
            margin-top: 0;
            color: #ffcc00;
            font-size: 24px;
        }
        .score-val {
            font-size: 48px;
            font-weight: bold;
            color: #ff3333;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255,51,51,0.5);
        }
        #retry-btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            margin-top: 15px;
        }
        #instruction {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            text-align: center;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div id="score-box" class="hud-box">得点: --</div>
        <div id="status-box" class="hud-box">構え（右足固定）</div>
    </div>

    <div id="instruction">力加減に注意！火点マークへ正確にドラッグ！</div>

    <div id="result-screen">
        <h2 id="result-title">審査結果</h2>
        <div id="result-deviation">基準点からのズレ: -- cm</div>
        <div id="result-score" class="score-val">100点</div>
        <div id="result-comment">コメント</div>
        <button id="retry-btn" onclick="resetGame()">再チャレンジ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const viewWidth = Math.min(window.innerWidth, 450);
    const viewHeight = window.innerHeight;
    canvas.width = viewWidth;
    canvas.height = viewHeight;

    const startY = viewHeight * 0.85; 
    const targetY = viewHeight * 0.15; // 10mの理想到達基準点（火点の中心座標）
    const playLengthPx = startY - targetY; 
    const pxToCm = 1000 / playLengthPx; 

    let gameState = 'ready'; // ready, flicking, rolling, bouncing, result
    let startX = 0;
    let startY_touch = 0;
    let startTime = 0;
    
    // ホースの物理形状軌跡（緩みを再現するため下線と上線で分離）
    let hosePointsLower = []; 
    let hosePointsUpper = []; 
    
    let rollProgress = 0; // 転がりの進捗値 (0.0 〜 1.0相当)
    let maxRollTarget = 0; // 勢いに応じた最大の到達到達ポテンシャル
    let rollSpeed = 0;
    let rollCurve = 0; 
    let bounceTimer = 0; // 跳ね返りアニメーション用タイマー
    let finalEndpoint = { x: canvas.width / 2, y: targetY }; // 最終的な静止先端座標

    function resetGame() {
        gameState = 'ready';
        rollProgress = 0;
        maxRollTarget = 0;
        rollSpeed = 0;
        rollCurve = 0;
        bounceTimer = 0;
        hosePointsLower = [];
        hosePointsUpper = [];
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('score-box').innerText = '得点: --';
        document.getElementById('status-box').innerText = '構え（右足固定）';
        document.getElementById('instruction').style.display = 'block';
        draw();
    }

    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        } else if (e.changedTouches && e.changedTouches.length > 0) {
            return { x: e.changedTouches[0].clientX - rect.left, y: e.changedTouches[0].clientY - rect.top };
        } else {
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
    }

    function handleStart(x, y) {
        if (gameState !== 'ready') return;
        startX = x;
        startY_touch = y;
        startTime = performance.now();
        gameState = 'flicking';
    }

    function handleEnd(endX, endY) {
        if (gameState !== 'flicking') return;
        const duration = performance.now() - startTime;

        const deltaX = endX - startX;
        const deltaY = endY - startY_touch;

        if (deltaY < -30) {
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('status-box').innerText = '展張中！';
            
            // 速度（強さ）の取得
            const speedInput = Math.min(Math.abs(deltaY) / Math.max(duration, 1) * 15, 35);
            
            // 勢いに応じた「どこまで転がろうとするか」のターゲット距離を設定
            // 理想（10mジャスト）は speedInput がおよそ 18〜20 の範囲
            maxRollTarget = (speedInput / 19.0); 
            
            rollSpeed = speedInput * 0.003;
            rollCurve = (deltaX / Math.abs(deltaY)) * 45; 

            generateHosePaths();
            gameState = 'rolling';
            animateRoll();
        } else {
            gameState = 'ready'; 
        }
    }

    // 各種イベント登録
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const coords = getCanvasCoords(e); handleStart(coords.x, coords.y); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); const coords = getCanvasCoords(e); handleEnd(coords.x, coords.y); }, { passive: false });
    canvas.addEventListener('mousedown', (e) => { const coords = getCanvasCoords(e); handleStart(coords.x, coords.y); });
    window.addEventListener('mouseup', (e) => { if (gameState !== 'flicking') return; const coords = getCanvasCoords(e); handleEnd(coords.x, coords.y); });

    // 二重巻ホースの上線・下線のうねりと重なりのズレを生成
    function generateHosePaths() {
        hosePointsLower = [];
        hosePointsUpper = [];
        const segments = 120;
        
        let currentXLower = canvas.width / 2;
        let currentXUpper = canvas.width / 2;

        // 最大値を超えて突っ込む場合を考慮した配列拡張
        const maxSegments = Math.ceil(segments * Math.max(maxRollTarget, 1.3));

        for (let i = 0; i <= maxSegments; i++) {
            const ratio = i / segments; 
            const y = startY - (playLengthPx * ratio);
            
            if (i > 0) {
                // 基本の蛇行ノイズ
                const noise = Math.sin(ratio * Math.PI * 2.5) * (rollCurve * 0.4);
                const drift = ratio * ratio * rollCurve * 1.2;
                
                // 下側のホースのベースライン
                currentXLower = (canvas.width / 2) + drift + noise;
                
                // 【新仕様】ブレ（rollCurve）が大きいほど、上線と下線が緩んで横にズレる物理再現
                const looseness = Math.sin(ratio * Math.PI * 1.5) * (rollCurve * 0.35);
                currentXUpper = currentXLower + looseness;
            }
            
            hosePointsLower.push({ x: currentXLower, y: y });
            hosePointsUpper.push({ x: currentXUpper, y: y });
        }
    }

    // 物理アニメーションループ
    function animateRoll() {
        if (gameState === 'rolling') {
            rollProgress += rollSpeed;
            rollSpeed *= 0.975; // 地面抵抗の減速

            // 勢いが尽きるか、設定された最大到達点に達したとき
            if (rollProgress >= maxRollTarget || rollSpeed < 0.0004) {
                // 【新仕様】もし10m（進捗1.0）を大幅に超える勢い（1.05以上）があった場合は跳ね返りフェーズへ
                if (rollProgress > 1.03) {
                    gameState = 'bouncing';
                    bounceTimer = 0;
                    document.getElementById('status-box').innerText = '先端跳ね返り発生！';
                    animateBounce();
                    return;
                } else {
                    endGame();
                    return;
                }
            }
            draw();
            requestAnimationFrame(animateRoll);
        }
    }

    // 【新仕様】勢い余った時の跳ね返り（バック）物理アニメーション
    function animateBounce() {
        if (gameState !== 'bouncing') return;

        bounceTimer += 0.08;
        // サイン波を使って、先端がキュッと手前に引き戻される（縮む）挙動を表現
        const bounceOffset = Math.sin(bounceTimer) * (rollProgress * 0.06);
        
        // 徐々に減衰させて停止
        if (bounceTimer >= Math.PI) {
            rollProgress -= (rollProgress * 0.06); // 最終的に手前に戻った位置で固定
            endGame();
            return;
        }

        // アニメーション中の進捗を一時的に戻す
        rollProgress -= (Math.cos(bounceTimer) + 1) * 0.0015;

        draw();
        requestAnimationFrame(animateBounce);
    }

    // 採点（100点満点から、火点中心点と先端の絶対直線距離cmをそのまま引く）
    function endGame() {
        gameState = 'result';
        
        const currentIndex = Math.min(Math.floor(rollProgress * 120), hosePointsLower.length - 1);
        // 静止した先端（折り返し地点）の座標
        finalEndpoint = hosePointsLower[currentIndex];

        // 【新仕様】10m基準点（canvas.width/2, targetY）からの絶対直線距離（ピクセル）を計算
        const diffX = finalEndpoint.x - (canvas.width / 2);
        const diffY = finalEndpoint.y - targetY;
        const totalDistancePx = Math.sqrt(diffX * diffX + diffY * diffY);

        // ピクセルから実際のセンチメートル（cm）へ換算
        const deviationCm = Math.round(totalDistancePx * pxToCm * 10) / 10;
        
        // 1cmにつき1点減点
        let score = 100 - Math.floor(deviationCm);
        if (score < 0) score = 0;

        document.getElementById('score-box').innerText = `得点: ${score}点`;
        document.getElementById('status-box').innerText = `審査完了`;
        document.getElementById('result-deviation').innerText = `基準点からのズレ: ${deviationCm} cm`;
        document.getElementById('result-score').innerText = `${score}点`;

        // 状態に応じた実践的なコメント分岐
        let comment = "完璧な展張です！距離・直進性ともに文句なし、100点満点！";
        if (score < 100) {
            if (finalEndpoint.y > targetY + 5) {
                comment = "力が弱く、10m先までホースが伸びきっていません。もっと力強く押し出してください！";
            } else if (diffY < -5) {
                comment = "勢いが良すぎたため、先端で激しい跳ね返り（バック）が起き、手前に戻ってしまいました。";
            } else {
                comment = "直進性がブレたため、重なりが緩んで左右に逸れています。左手のガイドを意識しましょう。";
            }
        }
        if (score < 80) comment = "蛇行と前後のズレが重なっています。目線を火点にカチッと合わせ、再チャレンジ！";
        if (score < 60) comment = "著しいズレです。右足の固定、あるいは押し出し方向の軸が完全に崩れています。";

        document.getElementById('result-comment').innerText = comment;
        document.getElementById('result-screen').style.display = 'block';

        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 理想の一直線（白点線）
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, startY);
        ctx.lineTo(canvas.width / 2, targetY);
        ctx.stroke();
        ctx.setLineDash([]);

        // メートル目盛
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'right';
        for (let m = 0; m <= 12; m += 2) {
            const y = startY - (playLengthPx * (m / 10));
            ctx.fillText(`${m}m`, canvas.width - 15, y + 4);
            ctx.fillRect(canvas.width - 10, y, 10, 1);
        }

        // 火点（標的）マーク
        const targetRadius = 22;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.arc(canvas.width / 2, targetY, targetRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ff3333';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('火', canvas.width / 2, targetY);

        // スタートライン
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, startY, canvas.width, 3);

        // ホースの二重巻描画
        if (hosePointsLower.length > 0) {
            const currentIndex = Math.min(Math.floor(rollProgress * 120), hosePointsLower.length - 1);
            
            // 1. 下側のホース（地面に設置するライン：灰白色で少し太め）
            ctx.strokeStyle = '#eaeaea';
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, startY);
            for (let i = 0; i <= currentIndex; i++) {
                ctx.lineTo(hosePointsLower[i].x, hosePointsLower[i].y);
            }
            ctx.stroke();

            // 下線に立体感を出すための内側シャドウ
            ctx.strokeStyle = '#c8c8c8';
            ctx.lineWidth = 11;
            ctx.stroke();

            // 2. 【新仕様】上側のホース（手元から伸びるライン：純白色で細め。ズレを強調）
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, startY);
            for (let i = 0; i <= currentIndex; i++) {
                ctx.lineTo(hosePointsUpper[i].x, hosePointsUpper[i].y);
            }
            ctx.stroke();

            // メス金具（スタート位置に固定）
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, startY, 9, 0, Math.PI * 2);
            ctx.fill();

            // 3. 転がる巻本体（停止時は消える）
            if (gameState === 'rolling' || gameState === 'bouncing') {
                const head = hosePointsLower[currentIndex];
                // 残りの巻が小さくなる直径シミュレーション
                const currentRatio = currentIndex / 120;
                const rollRadius = Math.max(18 - (11 * currentRatio), 7);

                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.arc(head.x + 4, head.y + 4, rollRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#e0e0e0';
                ctx.beginPath();
                ctx.arc(head.x, head.y, rollRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#999';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.arc(head.x, head.y, rollRadius * 0.6, 0, Math.PI * 2);
                ctx.stroke();
            } else if (gameState === 'result') {
                // 【結果画面時】止まった折り返し地点を目立たせるピン表示
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(finalEndpoint.x, finalEndpoint.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // オス金具（手元に待機）
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, startY - 5, 7, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 初期状態のホースの巻束
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.arc(canvas.width / 2 + 3, startY - 15, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, startY - 15, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#bbb';
            ctx.lineWidth = 2;
            for(let r = 5; r < 20; r += 4) {
                ctx.beginPath();
                ctx.arc(canvas.width / 2, startY - 15, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = '#d4af37';
            ctx.fillRect(canvas.width / 2 - 12, startY - 4, 24, 8);
        }
    }

    resetGame();
    window.addEventListener('resize', () => {
        canvas.width = Math.min(window.innerWidth, 450);
        canvas.height = window.innerHeight;
        resetGame();
    });
</script>
</body>
</html>
