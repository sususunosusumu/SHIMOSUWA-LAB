<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>第30回操法大会 ホース展張練習プログラム V3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background-color: #4a5d4e; /* 操法場の地面 */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: pointer;
        }
        #ui-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ffcc00;
        }
        #result-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 320px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffcc00;
            border-radius: 10px;
            color: white;
            text-align: center;
            padding: 20px;
            display: none;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }
        #result-screen h2 {
            margin-top: 0;
            color: #ffcc00;
            font-size: 24px;
        }
        .score-val {
            font-size: 48px;
            font-weight: bold;
            color: #ff3333;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255,51,51,0.5);
        }
        #retry-btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            margin-top: 15px;
        }
        #instruction {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            text-align: center;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div id="score-box" class="hud-box">得点: --</div>
        <div id="status-box" class="hud-box">構え（右足固定）</div>
    </div>

    <div id="instruction">火点マークを狙って上へ素早くドラッグ！</div>

    <div id="result-screen">
        <h2 id="result-title">審査結果</h2>
        <div id="result-deviation">基準点からのズレ: -- cm</div>
        <div id="result-score" class="score-val">100点</div>
        <div id="result-comment">コメント</div>
        <button id="retry-btn" onclick="resetGame()">再チャレンジ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const viewWidth = Math.min(window.innerWidth, 450);
    const viewHeight = window.innerHeight;
    canvas.width = viewWidth;
    canvas.height = viewHeight;

    const startY = viewHeight * 0.85; 
    const targetY = viewHeight * 0.15; // 10m地点の絶対限界壁（火点の中心座標）
    const playLengthPx = startY - targetY; 
    const pxToCm = 1000 / playLengthPx; 

    let gameState = 'ready'; // ready, flicking, rolling, bouncing, result
    let startX = 0;
    let startY_touch = 0;
    let startTime = 0;
    
    let hosePointsLower = []; 
    let hosePointsUpper = []; 
    
    let rollProgress = 0; // 現在の進捗位置 (0.0 〜 1.0) ※1.0が10mジャストの壁
    let targetProgress = 0; // 投げた勢いによる理想の進み予定位置
    let rollSpeed = 0;
    let rollCurve = 0; 
    let bounceSpeed = 0; // 跳ね返りバックの速度

    function resetGame() {
        gameState = 'ready';
        rollProgress = 0;
        targetProgress = 0;
        rollSpeed = 0;
        rollCurve = 0;
        bounceSpeed = 0;
        hosePointsLower = [];
        hosePointsUpper = [];
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('score-box').innerText = '得点: --';
        document.getElementById('status-box').innerText = '構え（右足固定）';
        document.getElementById('instruction').style.display = 'block';
        draw();
    }

    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        } else if (e.changedTouches && e.changedTouches.length > 0) {
            return { x: e.changedTouches[0].clientX - rect.left, y: e.changedTouches[0].clientY - rect.top };
        } else {
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
    }

    function handleStart(x, y) {
        if (gameState !== 'ready') return;
        startX = x;
        startY_touch = y;
        startTime = performance.now();
        gameState = 'flicking';
    }

    function handleEnd(endX, endY) {
        if (gameState !== 'flicking') return;
        const duration = performance.now() - startTime;

        const deltaX = endX - startX;
        const deltaY = endY - startY_touch;

        if (deltaY < -20) {
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('status-box').innerText = '展張中！';
            
            // 入力速度の取得
            const speedInput = Math.min(Math.abs(deltaY) / Math.max(duration, 1) * 15, 40);
            
            // 【改善】普通の投げ（speedInputが10以上など）であれば10mにしっかり到達するように調整
            targetProgress = speedInput * 0.075; 
            if (targetProgress > 0.85) {
                // ある程度しっかり投げたら確実に10m（進捗1.0）へ届くように底上げ
                targetProgress = Math.max(targetProgress, 1.0); 
            }
            
            rollSpeed = Math.max(speedInput * 0.004, 0.012);
            rollCurve = (deltaX / Math.abs(deltaY)) * 45; 

            generateHosePaths();
            gameState = 'rolling';
            animateRoll();
        } else {
            gameState = 'ready'; 
        }
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const coords = getCanvasCoords(e); handleStart(coords.x, coords.y); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); const coords = getCanvasCoords(e); handleEnd(coords.x, coords.y); }, { passive: false });
    canvas.addEventListener('mousedown', (e) => { const coords = getCanvasCoords(e); handleStart(coords.x, coords.y); });
    window.addEventListener('mouseup', (e) => { if (gameState !== 'flicking') return; const coords = getCanvasCoords(e); handleEnd(coords.x, coords.y); });

    function generateHosePaths() {
        hosePointsLower = [];
        hosePointsUpper = [];
        const segments = 100; // 0〜100が 0m〜10mジャスト

        for (let i = 0; i <= segments; i++) {
            const ratio = i / segments; 
            const y = startY - (playLengthPx * ratio);
            
            let currentXLower = canvas.width / 2;
            let currentXUpper = canvas.width / 2;

            if (i > 0) {
                const noise = Math.sin(ratio * Math.PI * 2.5) * (rollCurve * 0.4);
                const drift = ratio * ratio * rollCurve * 1.2;
                currentXLower = (canvas.width / 2) + drift + noise;
                
                // ブレが大きいほど重なりが崩れて横ズレする表現
                const looseness = Math.sin(ratio * Math.PI * 1.5) * (rollCurve * 0.35);
                currentXUpper = currentXLower + looseness;
            }
            
            hosePointsLower.push({ x: currentXLower, y: y });
            hosePointsUpper.push({ x: currentXUpper, y: y });
        }
    }

    function animateRoll() {
        if (gameState !== 'rolling') return;

        rollProgress += rollSpeed;
        rollSpeed *= 0.975; // 地面抵抗減速

        // 【新物理】進捗1.0（10m地点）はホースの物理的限界なので絶対に超えない
        if (rollProgress >= 1.0) {
            rollProgress = 1.0; 
            
            // 10mの壁にぶつかったときの「余剰な勢い（超過していたはずのエネルギー）」を計算
            const excessForce = targetProgress - 1.0;

            if (excessForce > 0.05) {
                // 【新仕様】空気の抜けたボールが壁に当たったような、わずかな跳ね返り挙動に移行
                gameState = 'bouncing';
                bounceSpeed = Math.min(excessForce * 0.05, 0.03); // 跳ね返る初速（最大でも30cm〜40cm程度に限定）
                document.getElementById('status-box').innerText = '10m限界で微跳ね返り！';
                animateBounce();
                return;
            } else {
                endGame();
                return;
            }
        }

        // 10mに届く前に勢いが尽きた場合
        if (rollProgress >= targetProgress || rollSpeed < 0.0005) {
            if (rollProgress > targetProgress) rollProgress = targetProgress;
            endGame();
            return;
        }

        draw();
        requestAnimationFrame(animateRoll);
    }

    // 【新物理】空気の抜けたボールのような「ポスッ」とした微小な跳ね返り
    function animateBounce() {
        if (gameState !== 'bouncing') return;

        rollProgress -= bounceSpeed; // 手前（減少方向）に戻る
        bounceSpeed *= 0.85; // 空気が抜けているので、急速に反動を失って止まる

        if (bounceSpeed < 0.001) {
            gameState = 'result';
            endGame();
            return;
        }

        draw();
        requestAnimationFrame(animateBounce);
    }

    function endGame() {
        gameState = 'result';
        
        // 静止した折り返し地点のインデックスと座標（0〜100に収まる）
        const index = Math.max(0, Math.min(100, Math.floor(rollProgress * 100)));
        const finalEndpoint = hosePointsLower[index];

        // 10m基準点（canvas.width/2, targetY）からの絶対直線距離（cm）を計算
        const diffX = finalEndpoint.x - (canvas.width / 2);
        const diffY = finalEndpoint.y - targetY;
        const totalDistancePx = Math.sqrt(diffX * diffX + diffY * diffY);
        const deviationCm = Math.round(totalDistancePx * pxToCm * 10) / 10;
        
        let score = 100 - Math.floor(deviationCm);
        if (score < 0) score = 0;

        document.getElementById('score-box').innerText = `得点: ${score}点`;
        document.getElementById('status-box').innerText = `審査完了`;
        document.getElementById('result-deviation').innerText = `基準点からのズレ: ${deviationCm} cm`;
        document.getElementById('result-score').innerText = `${score}点`;

        let comment = "完璧な展張です！100点満点、お見事！";
        if (score < 100) {
            if (rollProgress < 0.98) {
                comment = "押し出しが弱く、10m先までホースが伸びきっていません。";
            } else if (index === 100 && Math.abs(diffX) > 3) {
                comment = "距離は10m届いていますが、左右の軸がブレて基準点から逸れています。";
            } else {
                comment = "勢いが良すぎたため、10m限界点に当たって手前にポスッと跳ね返って戻りました。";
            }
        }
        if (score < 80) comment = "蛇行や跳ね返りが重なっています。目線を火点へ真っ直ぐ向け、再チャレンジ！";

        document.getElementById('result-comment').innerText = comment;
        document.getElementById('result-screen').style.display = 'block';

        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 理想の一直線（白点線）
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, startY);
        ctx.lineTo(canvas.width / 2, targetY);
        ctx.stroke();
        ctx.setLineDash([]);

        // メートル目盛
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'right';
        for (let m = 0; m <= 10; m += 2) {
            const y = startY - (playLengthPx * (m / 10));
            ctx.fillText(`${m}m`, canvas.width - 15, y + 4);
            ctx.fillRect(canvas.width - 10, y, 10, 1);
        }

        // 火点マーク（10m基準壁）
        const targetRadius = 22;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.arc(canvas.width / 2, targetY, targetRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ff3333';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('火', canvas.width / 2, targetY);

        // スタートライン
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, startY, canvas.width, 3);

        // ホース描画
        if (hosePointsLower.length > 0) {
            const index = Math.max(0, Math.min(100, Math.floor(rollProgress * 100)));
            
            // 下線（灰白色）
            ctx.strokeStyle = '#eaeaea';
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, startY);
            for (let i = 0; i <= index; i++) {
                ctx.lineTo(hosePointsLower[i].x, hosePointsLower[i].y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#d0d0d0';
            ctx.lineWidth = 10;
            ctx.stroke();

            // 上線（純白色）
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, startY);
            for (let i = 0; i <= index; i++) {
                ctx.lineTo(hosePointsUpper[i].x, hosePointsUpper[i].y);
            }
            ctx.stroke();

            // メス金具
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, startY, 9, 0, Math.PI * 2);
            ctx.fill();

            // 転がる巻本体（停止時は非表示）
            if (gameState === 'rolling' || gameState === 'bouncing') {
                const head = hosePointsLower[index];
                const rollRadius = Math.max(18 - (11 * (index / 100)), 7);

                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.arc(head.x + 4, head.y + 4, rollRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#e0e0e0';
                ctx.beginPath();
                ctx.arc(head.x, head.y, rollRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#999';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.arc(head.x, head.y, rollRadius * 0.6, 0, Math.PI * 2);
                ctx.stroke();
            } else if (gameState === 'result') {
                // 静止先端の赤ピン
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(finalEndpoint.x, finalEndpoint.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // オス金具
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, startY - 5, 7, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 初期巻束状態
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.arc(canvas.width / 2 + 3, startY - 15, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, startY - 15, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#bbb';
            ctx.lineWidth = 2;
            for(let r = 5; r < 20; r += 4) {
                ctx.beginPath();
                ctx.arc(canvas.width / 2, startY - 15, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = '#d4af37';
            ctx.fillRect(canvas.width / 2 - 12, startY - 4, 24, 8);
        }
    }

    resetGame();
    window.addEventListener('resize', () => {
        canvas.width = Math.min(window.innerWidth, 450);
        canvas.height = window.innerHeight;
        resetGame();
    });
</script>
</body>
</html>
